<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Panel del Colaborador</title>
    <link rel="stylesheet" href="style-pantallaUsuario.css">
    <style>
        .campo-error {
            border-color: #e74c3c !important;
            background-color: #fadbd8 !important;
        }
        .error-msg {
            color: #e74c3c;
            font-size: 0.85em;
            margin-top: 4px;
            display: block;
        }
    </style>
    <!-- Módulos de la aplicación -->
    <script src="modulos/validaciones.js"></script>
    <script src="modulos/autenticacion.js"></script>
    <script src="modulos/talleres.js"></script>
    <script src="modulos/mapa.js"></script>
</head>

<body onload="mostrarUsuario();">

    <!-- HEADER -->
    <header class="header">
        <h1>¡Bienvenido!</h1>
        <nav>

            <a href="misTalleres.html">Mis talleres</a>
        </nav>

        <div class="user-info">
            <span><span id="usuario_nombre"></span></span>
            <button onclick="cerrarSesion()">Cerrar sesión</button>
        </div>
    </header>

    <!-- CONTENIDO -->
    <main class="contenedor">

        <!-- DERECHA -->
        <section class="formulario">
            <h2>Registrá tu taller</h2>
            <form onsubmit="return false;">
                <label for="nombre_taller">Nombre del taller <span style="color: red;">*</span></label>
                <input type="text" id="nombre_taller" placeholder="Ej: Taller de Pintura" maxlength="100">
                
                <label for="descripcion_taller">Descripción <span style="color: red;">*</span></label>
                <textarea id="descripcion_taller" placeholder="Describe tu taller (mín. 10 caracteres)" maxlength="500" rows="4"></textarea>
                
                <label for="rubro_taller">Rubro <span style="color: red;">*</span></label>
                <select id="rubro_taller">
                    <option value="">-- Selecciona un rubro --</option>
                    <option value="Artes Plásticas">Artes Plásticas</option>
                    <option value="Danza">Danza</option>
                    <option value="Música">Música</option>
                    <option value="Teatro">Teatro</option>
                    <option value="Literatura">Literatura</option>
                    <option value="Tecnología">Tecnología</option>
                    <option value="Idiomas">Idiomas</option>
                    <option value="Deportes">Deportes</option>
                    <option value="Bienestar">Bienestar</option>
                    <option value="Otro">Otro</option>
                </select>
                
                <label for="actividades_taller">Actividades </label>
                <input type="text" id="actividades_taller" placeholder="Ej: Pintura, Escultura" maxlength="200">
                
                <label for="direccion_taller">Dirección <span style="color: red;">*</span></label>
                <input type="text" id="direccion_taller" placeholder="Ej: Calle 25 de Mayo 450, La Matanza" maxlength="200">
                
                <label for="horarios_taller">Horarios <span style="color: red;">*</span></label>
                <select id="horarios_taller">
                    <option value="">-- Selecciona franja horaria --</option>
                    <option value="Mañana (8:00 - 12:00)">Mañana (8:00 - 12:00)</option>
                    <option value="Tarde (13:00 - 17:00)">Tarde (13:00 - 17:00)</option>
                    <option value="Noche (18:00 - 22:00)">Noche (18:00 - 22:00)</option>
                    <option value="Flexible">Flexible</option>
                </select>
                
                <label for="contacto_taller">Teléfono <span style="color: red;">*</span></label>
                <input type="tel" id="contacto_taller" placeholder="Ej: 11-1234-5678" maxlength="20">
                
                <label for="redes_taller">Redes Sociales</label>
                <input type="text" id="redes_taller" placeholder="@usuario o instagram.com/usuario" maxlength="200">
                
                <label for="foto_taller">Imagen</label>
                <input type="url" id="foto_taller" placeholder="https://ejemplo.com/imagen.jpg" maxlength="300">

                <button onclick="registrarTaller()">Guardar Taller</button>
            </form>
        </section>
    </main>

    <script src="app.js"></script>
</body>

</html>
